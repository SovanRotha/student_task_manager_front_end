
[project]
name = "back-end-student-task-manager"
version = "0.1.0"
description = "Student Task Manager API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]",
    "psycopg[binary]>=3.3.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.14.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
